[build]
  command = "npm run build"
  publish = "dist"

# sitemap.xml is generated by Eleventy (src/sitemap.liquid), skipping pages with `noindex: true`

# Send www straight to the apex domain in a single hop
[[redirects]]
  from = "https://www.discoliam.com/*"
  to = "https://discoliam.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.discoliam.com/*"
  to = "https://discoliam.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
